name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character SHA of the commit to redeploy'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_HOST: 51.255.42.146
  DEPLOY_KNOWN_HOSTS: '51.255.42.146 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEbEn9NUsA5n7n1DSBWaozWpMVcs7JsBn6Y82kH3oGxN'

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Resolve the image tag
        id: tag
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Not a full commit SHA: $SHA"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"

  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  image:
    needs: tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/joanroucoux/joanroucoux.fr:${{ needs.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check_image:
    needs: tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      packages: read
    steps:
      - name: Refuse a commit whose CI did not pass
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.tag.outputs.sha }}
        run: |
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=ci%20%2F%20ci" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          [ "$passed" -gt 0 ] || { echo "::error::CI never passed on ${SHA}"; exit 1; }

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse a commit that has no image
        env:
          TAG: ${{ needs.tag.outputs.image }}
        run: |
          docker manifest inspect "ghcr.io/joanroucoux/joanroucoux.fr:${TAG}" > /dev/null \
            || { echo "::error::No joanroucoux.fr image tagged ${TAG}"; exit 1; }

  deploy:
    needs: [tag, ci, image, check_image]
    if: ${{ !cancelled() && needs.tag.result == 'success' && ((needs.ci.result == 'success' && needs.image.result == 'success') || needs.check_image.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ needs.tag.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - name: Authorize this runner on the server
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Ship the deploy files
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/compose.prod.yaml deploy/deploy.sh "deploy@${DEPLOY_HOST}:/srv/joanroucoux.fr/"

      - name: Start the new site
        run: |
          printf '%s\n' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh -i ~/.ssh/id_ed25519 "deploy@${DEPLOY_HOST}" \
                "bash /srv/joanroucoux.fr/deploy.sh '${IMAGE_TAG}' '${{ github.actor }}'"

      - name: Install the Caddy snippet and reload the shared proxy
        run: |
          scp -i ~/.ssh/id_ed25519 deploy/site.caddy "deploy@${DEPLOY_HOST}:/srv/proxy/sites/joanroucoux.fr.caddy"
          ssh -i ~/.ssh/id_ed25519 "deploy@${DEPLOY_HOST}" \
            "docker exec proxy-caddy-1 caddy reload --config /etc/caddy/Caddyfile"

      - name: Check the pages are served
        run: |
          for path in / /en; do
            code=$(curl -sS --resolve "joanroucoux.fr:443:${DEPLOY_HOST}" --retry 10 --retry-all-errors --retry-delay 3 -o /dev/null -w '%{http_code}' "https://joanroucoux.fr${path}")
            echo "GET ${path} -> ${code}"
            [ "$code" = "200" ] || exit 1
          done

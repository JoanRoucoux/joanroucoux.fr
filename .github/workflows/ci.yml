name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Check internal links and assets
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --base-url ${{ github.workspace }}/dist/joanroucoux-fr/browser 'dist/joanroucoux-fr/browser/**/*.html'
          fail: true

      - name: Check the prerendered pages
        run: pnpm run check:prerender

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the production image
        run: docker build -t app:ci .

      - name: Start the container and wait until it is healthy
        run: |
          docker run -d --name web -p 8080:80 --health-interval 2s app:ci
          for _ in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy ] && break
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy ]

      - name: Check routing, error pages and headers
        run: |
          base=http://localhost:8080
          code() { curl -s -o /dev/null -w '%{http_code}' "$base$1"; }
          for path in / /en /mentions-legales /en/legal; do
            [ "$(code "$path")" = 200 ] || { echo "$path is not 200"; exit 1; }
          done
          curl -sf "$base/" | grep -q "Joan Roucoux</h1>"
          curl -sf "$base/en" | grep -q "Joan Roucoux</h1>"
          curl -sf "$base/mentions-legales" | grep -q "Mentions légales</h1>"
          curl -sf "$base/en/legal" | grep -q "Legal notice</h1>"
          [ "$(code /en/)" = 301 ]
          curl -sI "$base/en/" | tr -d '\r' | grep -qi "^location: /en$"
          for path in /projets /en/x; do
            [ "$(code "$path")" = 404 ] || { echo "$path is not 404"; exit 1; }
            curl -s "$base$path" | grep -q "Page introuvable"
            if curl -s "$base$path" | grep -q "Joan Roucoux</h1>"; then exit 1; fi
          done
          [ "$(code /missing.js)" = 404 ]
          [ "$(code /%5Cevil.com/)" = 404 ]
          [ "$(code /mentions-legales/)" = 301 ]
          curl -sfI "$base/" | tr -d '\r' | grep -qi "^content-security-policy:.*trusted-types angular"
          curl -sfI "$base/" | tr -d '\r' | grep -qi "^cache-control: no-cache"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Production end-to-end tests
        run: pnpm exec playwright test -c playwright-prod.config.ts

  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

      - name: Validate the Caddy snippet
        run: |
          docker run --rm -e ACME_EMAIL=ci@example.com -v "$PWD/deploy:/etc/caddy/sites:ro" caddy:2.11.7-alpine sh -c 'printf "{\n\temail {\$ACME_EMAIL}\n\tlog default {\n\t\texclude http.log.access\n\t}\n}\nimport /etc/caddy/sites/*.caddy\n" > /tmp/Caddyfile && caddy validate --config /tmp/Caddyfile'

  ci:
    if: always()
    needs: [checks, e2e, docker, ops]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done

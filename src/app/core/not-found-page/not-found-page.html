<main class="mx-auto flex max-w-3xl flex-col items-center gap-4 px-4 py-24 text-center" id="main-content">
  <h1 class="text-4xl font-bold tracking-tight">{{ 'notFound.title' | transloco }}</h1>
  <p class="max-w-xl text-lg text-(--muted-foreground)">{{ 'notFound.description' | transloco }}</p>
  <a
    class="mt-2 inline-flex items-center justify-center rounded-md bg-(--primary) px-4 py-2 text-sm font-medium text-(--primary-foreground) transition-colors hover:bg-(--primary)/90"
    [routerLink]="homeLink"
  >
    {{ 'notFound.home' | transloco }}
  </a>
</main>
